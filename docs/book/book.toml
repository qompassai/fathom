# Reference: https://rust-lang.github.io/mdBook/format/configuration/index.html
#
# Toolchain compatibility (verified with mdBook 0.5.4 on 2026-10-10):
# - mdBook 0.5 rejects unknown configuration fields, so HTML options are
#   kept under [output.html] and search options under [output.html.search].
# - mdbook-admonish is opt-in below: the stock crates.io 1.20.0 release
#   (and the installed 1.18.0 build) targets the mdBook 0.4 preprocessor
#   protocol and cannot parse mdBook 0.5 input. mdBook 0.5's native
#   admonitions are enabled under [output.html] instead.
# - mdbook-d2 is opt-in below: mdBook 0.5 support starts with
#   mdbook-d2 0.3.7; 0.3.8 is the compatible release line. The
#   installed 0.2.2 build cannot parse mdBook 0.5 input.
# - mdbook-pandoc is marked optional so hosts without that backend can
#   still build the HTML, EPUB, and Markdown outputs.
# - input-404 is intentionally unset: mdBook uses its default 404
#   page unless a project supplies its own input file and sets the key.

[book]
authors = ["John Doe"]
description = "The example book covers examples."
language = "en"
src = "src"
text-direction = "ltr"
title = "fathom — Reverse Engineer Anything (Rust port)"

[build]
build-dir = "book"
create-missing = true
extra-watch-dirs = []
use-default-preprocessors = true

# Optional preprocessors (not enabled by default):
# [preprocessor.admonish] (requires an mdBook 0.5-compatible build; see header)
# default = { collapsible = true }
#
# [preprocessor.d2] (requires mdbook-d2 >= 0.3.7; see header)
# renderers = ["html"]

[preprocessor.footnote]
renderers = ["html"]

[preprocessor.graphviz]
renderers = ["html"]

[preprocessor.katex]
renderers = ["html"]

[preprocessor.links]
renderers = ["html"]

[preprocessor.mermaid]
renderers = ["html"]

[preprocessor.pagetoc]
renderers = ["html"]

[output.epub]
command = "mdbook-epub"

[output.html]
additional-css = ["theme/book.css"]
additional-js = ["theme/book.js"]
admonitions = true
cname = "myproject.rs"
definition-lists = true
edit-url-template = "https://github.com/rust-lang/mdBook/edit/master/guide/{path}"
git-repository-icon = "fab-github"
git-repository-url = "https://github.com/rust-lang/mdBook"
mathjax-support = false
no-section-label = false
preferred-dark-theme = "navy"
sidebar-header-nav = true
site-url = "/example-book/"
smart-punctuation = true

[output.html.code]
hidelines = { python = "~" }

[output.html.fold]
enable = false
level = 0

[output.html.playground]
copyable = true
copy-js = true
editable = false
line-numbers = false
runnable = true

[output.html.print]
enable = true
page-break = true

[output.html.search]
boost-hierarchy = 2
boost-paragraph = 1
boost-title = 2
enable = true
expand = true
heading-split-level = 3
limit-results = 30
teaser-word-count = 30
use-boolean-and = true

# Project-specific search indexing example (enable only when these
# chapter paths exist; mdBook 0.5 fails the HTML render if they do not):
# [output.html.search.chapter]
# "appendix" = { enable = false }
# "appendix/glossary.md" = { enable = true }

[output.markdown]

[output.pandoc]
command = "mdbook-pandoc"
optional = true

[rust]
edition = "2024"
