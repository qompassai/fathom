# Fathom worker profile for OpenAPPA (estate adaptation, 2026-10-10).
#
# Case: a dispatched Claude worker building and analyzing with fathom
# (the Rust reverse-engineering tool provider) in this repository. This
# profile is the estate's second deterministic gate, modeled on the
# OpenAPPA pilot's image profile (~/openappa-pilot, appa 0.30.0 pinned
# at 5060566a): it includes the claude-code battery and adds root rules
# for this repo — its build workflows, fathom's own tool tiers, and the
# data labels fathom's analysis artifacts carry.
#
# Root rules run before the included battery's rules, and the first
# matching rule wins. Sections are ordered so a stricter rule is never
# shadowed by a looser one: hard denies first, workflow allows last.
# Where a root rule replaces a battery rule for a whole tool (the bare
# Write and Edit gates), the battery's own ask-tier selectors are
# mirrored above it, so no battery protection is weakened.
#
# Data labels: fathom's analysis artifacts — decompiled output, HAR
# captures, process captures, Ghidra project data — live under the
# fathom state dir ($XDG_STATE_HOME/fathom) and may carry target
# secrets. Reading one narrows the session audience to `self`. While
# narrowed, network destinations are refused and writes land only in
# cleared destinations (the state dir and this repo's tree; both are
# contained sinks — pushes out of them are hard-denied below).

include = ["../../../../openappa-pilot/src/marketplace/batteries/claude-code/appa.toml"]

[policy]
version = 2
trust_chain = ["suspicious", "trusted"]

# --- destructive operations: hard deny, no remedy ---
#
# The pilot's set, in the pilot's spellings. `blocked` is the reserved
# attention mark no authority can permit.

[[policy.tool]]
name = "host/claude-code/Bash(command:*rm -rf*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*rm -fr*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*git reset*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*git clean*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*git push*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:gh *)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*sudo *)"
requires = { attention = ["blocked"] }
delta = {}

# --- fathom's own tools, by SPEC class ---
#
# SPEC §4/§8 classes map to tiers: `read` runs, `observe` runs at this
# layer (fathom's engine still default-denies observe/execute without
# a config allowlist — this gate allowing a call does not run it), and
# `execute` needs the human. The port's catalog has exactly one
# execute tool, capture_process, and its SPEC default-deny is
# preserved here as a hard rule: a worker session never runs it.
# The upstream mutate-provider-state class (Ghidra annotations and
# bookmarks) was not ported — projects re-open read-only — so it has
# no rules to write; a tool with no rule is undeclared in this policy
# and refused, and any future tool lands at ask-tier first, through
# the policy-change process in policy/README.md.

[[policy.tool]]
name = "mcp/fathom/capture_process"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "mcp/fathom/analyze_function"
delta = {}

[[policy.tool]]
name = "mcp/fathom/analyze_javascript_application"
delta = {}

[[policy.tool]]
name = "mcp/fathom/binary_overview"
delta = {}

[[policy.tool]]
name = "mcp/fathom/compare_artifacts"
delta = {}

[[policy.tool]]
name = "mcp/fathom/export_evidence_bundle"
delta = {}

[[policy.tool]]
name = "mcp/fathom/inspect_android_apk"
delta = {}

[[policy.tool]]
name = "mcp/fathom/inspect_artifact"
delta = {}

[[policy.tool]]
name = "mcp/fathom/inspect_asar"
delta = {}

[[policy.tool]]
name = "mcp/fathom/inspect_binary_layout"
delta = {}

[[policy.tool]]
name = "mcp/fathom/inspect_evm_bytecode"
delta = {}

[[policy.tool]]
name = "mcp/fathom/inspect_firmware"
delta = {}

[[policy.tool]]
name = "mcp/fathom/inspect_managed_assembly"
delta = {}

[[policy.tool]]
