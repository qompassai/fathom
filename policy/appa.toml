# --- the human authority ---
#
# Ask-tier requirements (`hitl`) are decided by the person running
# the session. Declared here as in upstream's push-only-to-the-org
# example: without a declared authority, an attention requirement
# has no one who can permit it and the call is refused outright.

[[policy.authority]]
name = "hitl"
hint = "Ask the person running this session."

[policy.authority.permits]
attention = ["hitl"]

[externals]
timeout_ms = 5000
max_body_bytes = 65536
