# --- analysis artifacts are sensitive: reading one narrows the
# session audience to `self` ---
#
# Every surface that can pull artifact content into the trajectory is
# labeled: Read, Grep, and Bash (cat/grep spellings) alike.

[[policy.tool]]
name = "host/claude-code/Read(file_path:*/.local/state/fathom/*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "host/claude-code/Read(file_path:.local/state/fathom/*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "host/claude-code/Read(file_path:*.har)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "host/claude-code/Read(file_path:*/captures/*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "host/claude-code/Grep(path:*/.local/state/fathom/*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "host/claude-code/Grep(path:*.har)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "host/claude-code/Bash(command:*/.local/state/fathom/*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "host/claude-code/Bash(command:*.har*)"
delta = { audience = ["self"] }

# --- network destinations: refused while the session carries
# sensitive data ---
#
# Each rule requires the widest audience, so the call runs only when
# nothing labeled has been read. At the default label these are
# ordinary commands; after a sensitive read they are exfiltration.

[[policy.tool]]
name = "host/claude-code/Bash(command:*curl*)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*wget*)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*nc *)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*ncat *)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*netcat *)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*rsync *)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*scp *)"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*sftp *)"
requires = { audience = { contains = ["public"] } }
delta = {}

# --- writes: the battery's ask-tier selectors, mirrored ---
#
# These six selectors per tool are the battery's own, with the
# battery's own requirement, repeated here because root rules run
# first: without the mirrors, the gated bare rules below would
# shadow them.

[[policy.tool]]
name = "host/claude-code/Write(file_path:*/.claude/settings*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:.claude/settings*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:*/appa/appa.toml)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:*/appa/batteries/*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:*.mcp.json)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:*.claude/hooks/*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:*/.claude/settings*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:.claude/settings*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:*/appa/appa.toml)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:*/appa/batteries/*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:*.mcp.json)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:*.claude/hooks/*)"
requires = { attention = ["hitl"] }
delta = {}

# --- writes: cleared destinations stay open while narrowed ---
#
# The state dir (the artifacts' home) and this repo's tree. Selector
# segments are exact: a lookalike such as `.local/state/fathom-evil`
# does not match and falls through to the gated bare rules.

[[policy.tool]]
name = "host/claude-code/Write(file_path:*/.local/state/fathom/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:*/rea-rust/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:*/.local/state/fathom/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit(file_path:*/rea-rust/*)"
delta = {}

# --- writes: everywhere else is gated on the label ---
#
# The bare rules. A write or edit outside the cleared destinations
# needs a trusted session carrying nothing sensitive: at the default
# label these are the worker's own writes and edits; after a
# sensitive read they are label confusion and are refused. The
# battery's trust-gated selectors (credential paths, shell startup
# files, launch agents) require `trusted` too, so this gate is never
# weaker than the battery rule it precedes.

[[policy.tool]]
name = "host/claude-code/Write"
requires = { trust = "trusted", audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/Edit"
requires = { trust = "trusted", audience = { contains = ["public"] } }
delta = {}

