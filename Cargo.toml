[workspace]
members = [
    "crates/fathom-a2a",
    "crates/fathom-cli",
    "crates/fathom-core",
    "crates/fathom-js",
    "crates/fathom-managed",
    "crates/fathom-mcp",
    "crates/fathom-native",
    "crates/fathom-observe",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
oxc_allocator = "0.153"
oxc_ast = "0.153"
oxc_ast_visit = "0.153"
oxc_parser = "0.153"
oxc_span = "0.153"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
toml = "1"
