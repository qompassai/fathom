[package]
name = "fathom-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "fathom TUI: clean-room rebuild workflow — pick a target directory, then census, spec, translation inventory, and plan over the fathom tool catalog"

[[bin]]
name = "fathom-tui"
path = "src/main.rs"

[dependencies]
crossterm.workspace = true
fathom-core = { version = "1.0.0", path = "../fathom-core" }
fathom-native = { version = "1.0.0", path = "../fathom-native" }
ratatui.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
