[package]
name = "fathom-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "fathom MCP transports: rmcp (modern era only) over stdio behind an era guard, and streamable HTTP"

[dependencies]
axum.workspace = true
fathom-core = { path = "../fathom-core" }
# Fleet pin (D-113): one rmcp version across every estate server;
# modern era (2026-07-28) only. The era guard in `guard.rs` owns
# the stdio front door; rmcp owns the envelope behind it.
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "sync"] }
